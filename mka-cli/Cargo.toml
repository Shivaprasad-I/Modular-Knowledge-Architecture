[package]
name = "mka"
version = "0.2.2"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
anyhow = "1.0"
regex = "1.10"
tree-sitter = "0.25.0"
libloading = "0.8"
jsonschema = "0.17"
toon = "0.1.2"
streaming-iterator = "0.1.9"
tokio = { version = "1.35", features = ["full"] }
rust-mcp-sdk = "0.9.0"
async-trait = "0.1"
async-recursion = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
sqlite-vec = "0.1.9"
ort = { version = "2.0.0-rc.12", features = ["download-binaries", "copy-dylibs"] }
sha2 = "0.10"
reqwest = { version = "0.11", features = ["json", "stream"] }
dirs = "5.0"
dialoguer = "0.11"
indicatif = "0.17"
futures-util = "0.3"
tokenizers = "0.19"

[dev-dependencies]
tempfile = "3.8"
# Removed include_dir as we are moving to remote cloning

[patch.crates-io]
esaxx-rs = { git = "https://github.com/ocentra/esaxx-rs.git", branch = "main" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

