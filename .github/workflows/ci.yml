name: CI Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Cache Tree-sitter parsers
        uses: actions/cache@v4
        with:
          path: ~/.mka
          key: ${{ runner.os }}-mka-treesitter-${{ hashFiles('mka-cli/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mka-treesitter-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Cargo Check
        run: cargo check --manifest-path mka-cli/Cargo.toml

      - name: Prepare Environment (Tree-sitter Parsers)
        shell: bash
        run: |
          mkdir -p ~/.mka/treesitter-debug
          if [ ! -f ~/.mka/treesitter-debug/rust.so ]; then
            cargo run --manifest-path mka-cli/Cargo.toml -- install rust
          fi

      - name: Run Tests
        # We skip some tests that require the ONNX model in CI unless we want to download it
        run: cargo test --manifest-path mka-cli/Cargo.toml
