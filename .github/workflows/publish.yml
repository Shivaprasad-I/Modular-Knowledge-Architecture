name: Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: mka-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: mka-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: mka-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: mka-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: mka-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: contains(matrix.target, 'linux')
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Binary
        run: |
          if [ "${{ contains(matrix.target, 'linux') }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --manifest-path mka-cli/Cargo.toml
          else
            cargo build --release --target ${{ matrix.target }} --manifest-path mka-cli/Cargo.toml
          fi
        shell: bash

      - name: Prepare Artifact
        run: |
          mkdir -p dist
          cp mka-cli/target/${{ matrix.target }}/release/mka${{ contains(matrix.target, 'windows') && '.exe' || '' }} dist/${{ matrix.artifact_name }}
        shell: bash

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: dist/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
