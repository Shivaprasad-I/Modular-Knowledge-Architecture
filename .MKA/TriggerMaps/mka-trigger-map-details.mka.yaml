id: mka-trigger-map-details
intent: "Extract and display detailed technical information for a specific trigger-map, including signatures and minified logic."
trigger_nodes:
  - file: "mka-cli/src/main.rs"
    method: "main"
    note: "Routes to the trigger-map command with optional --no-snippets flag to suppress default snippets."
  - file: "mka-cli/src/commands/trigger_map.rs"
    method: "handle"
    note: "Orchestrates YAML validation, source analysis, and TOON output."
  - file: "mka-cli/src/analyzer/mod.rs"
    method: "get_method_signature"
    note: "Uses Tree-sitter AST to extract precise method signatures."
  - file: "mka-cli/src/analyzer/mod.rs"
    method: "get_minified_logic"
    note: "Extracts logic block by searching Tree-sitter AST and triggers minification."
  - file: "mka-cli/src/analyzer/mod.rs"
    method: "minify_node"
    note: "Strips comments/boilerplate, applies indentation rules, and injects original source line numbers via forward-search algorithm."
  - file: "mka-cli/src/utils/mod.rs"
    method: "validate_yaml"
    note: "Strictly validates trigger-map YAML files against schema.json."
validation:
  test_file: "mka-cli/src/commands/trigger_map.rs"
