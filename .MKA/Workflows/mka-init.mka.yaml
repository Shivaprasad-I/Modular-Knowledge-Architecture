id: mka-init
intent: "Initialize the MKA directory structure in a project by cloning templates from GitHub using sparse-checkout."
workflow_nodes:
  - file: "mka-cli/src/main.rs"
    method: "main"
  - file: "mka-cli/src/commands/init.rs"
    method: "handle"
  - file: "mka-cli/src/utils/mod.rs"
    method: "copy_dir_recursive"
validation:
  test_file: "mka-cli/src/commands/init.rs"
