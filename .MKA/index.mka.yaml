project: Modular-Knowledge-Architecture
version: 1.0
trigger_maps:
- id: mka-init
  intent: Initialize MKA by sparse-cloning the template structure from GitHub.
  path: TriggerMaps/mka-init.mka.yaml
- id: mka-actions
  intent: List all available actions/trigger-maps in TOON format.
  path: TriggerMaps/mka-actions.mka.yaml
- id: mka-trigger-map-details
  intent: Extract technical details (signatures, logic) for a trigger-map.
  path: TriggerMaps/mka-trigger-map-details.mka.yaml
- id: mka-sync
  intent: Sync the MKA index and heal broken paths automatically.
  path: TriggerMaps/mka-sync.mka.yaml
